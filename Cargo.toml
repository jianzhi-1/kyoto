[workspace]
members = [
    "crates/server",
    "crates/scheduler",
    "crates/block-manager",
    "crates/worker",
    "crates/proto",
    "crates/router",
]
resolver = "2"

[workspace.lints.clippy]
needless_return = "allow"
unused_unit = "allow"


[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.11"
prost = "0.12"
async-channel = "2"
ndarray = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }